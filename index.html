// 🟢 Start Game
function startGame() {
     document.getElementById("bgMusic").play();
    
    document.getElementById("home").style.display = "none";
    document.getElementById("game").style.display = "block";
    loadQuestion();
}

// 📸 Load Question
function loadQuestion() {
    if (current < questions.length) {
        document.getElementById("meme").src = questions[current].img;
        document.getElementById("btn1").textContent = questions[current].options[0];
        document.getElementById("btn2").textContent = questions[current].options[1];
 
}
}

// ✅ Check Answer
function checkAnswer(choice) {
    if (choice === questions[current].answer) {
        score++;
        document.getElementById("result").textContent = " ✅Correct!";
    } else {
        document.getElementById("result").textContent = " ❌Wrong!";
    }

    document.getElementById("score").textContent = "Score: " + score;

    current++;
    
    if (current < questions.length) {
        loadQuestion();
    } else {
       document.getElementById("game").style.display = "none";
        document.getElementById("end").style.display = "block";

        document.getElementById("finalScore").textContent =
          "Final Score: " + score;
    }
}
    function restartGame() {
    score = 0;
    current = 0;

    document.getElementById("score").textContent = "Score: 0";

    document.getElementById("end").style.display = "none";
    document.getElementById("home").style.display = "block";

        let music = document.getElementById("bgMusic");
    music.pause();
    music.currentTime = 0;
    startGame();
    }
    // 🔊 Toggle Sound Button
function toggleSound() {
    let music = document.getElementById("bgMusic");
    let btn = document.querySelector(".sound-btn");
     
    Music.muted = !music.muted;

        if (music.muted) {
            btn.textContent = "🔇 Sound off";
        } else {
            btn.textContent = "🔊 Sound on";
        }
    
}
</script>

</button>
<script>
